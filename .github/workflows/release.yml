name: Release

# Pushing a tag such as v0.2.0 (or 0.2.0) builds the plugin zip and publishes a GitHub release with ONE asset,
# `bitsnap-for-woocommerce.zip` (no version in the name). That makes this address always the newest build:
#   https://github.com/emmems/bitsnap-woocommerce/releases/latest/download/bitsnap-for-woocommerce.zip
# Sites running the plugin find new releases from wp-admin (Plugin Update Checker reads the same release).
# Run the workflow by hand to build the zip and keep it as a workflow artifact, without publishing anything.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and check the version
        id: version
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' bitsnap-for-woocommerce.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//; s/\s+$//')
          const=$(grep -m1 "define( 'BITSNAP_WC_VERSION'" bitsnap-for-woocommerce.php | sed -E "s/.*', '([^']+)'.*/\1/")
          echo "header=$header stable=$stable constant=$const"
          if [ "$header" != "$stable" ] || [ "$header" != "$const" ]; then
            echo "::error::Version mismatch between the plugin header, BITSNAP_WC_VERSION and readme.txt Stable tag."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$header" ]; then
              echo "::error::The tag ($tag) does not match the plugin version ($header)."
              exit 1
            fi
          fi
          echo "version=$header" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the block script
        run: |
          npm ci
          npm run build

      - name: Compile translations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          bash bin/build-mo.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      # rsync with .distignore, then `composer install --no-dev --optimize-autoloader`, then zip.
      - name: Build the zip
        run: bash bin/build-zip.sh dist

      - name: Check the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip=dist/bitsnap-for-woocommerce.zip
          unzip -Z1 "$zip" > dist/files.txt
          if grep -v '^bitsnap-for-woocommerce/' dist/files.txt | grep -q .; then
            echo "::error::Everything in the zip must sit in the folder bitsnap-for-woocommerce/."
            exit 1
          fi
          for required in \
            bitsnap-for-woocommerce/bitsnap-for-woocommerce.php \
            bitsnap-for-woocommerce/readme.txt \
            bitsnap-for-woocommerce/build/blocks.js \
            bitsnap-for-woocommerce/languages/bitsnap-for-woocommerce-pl_PL.mo \
            bitsnap-for-woocommerce/vendor/autoload.php \
            bitsnap-for-woocommerce/vendor/yahnis-elsts/plugin-update-checker/plugin-update-checker.php
          do
            grep -qx "$required" dist/files.txt || { echo "::error::$required is missing from the zip."; exit 1; }
          done
          if grep -E '^bitsnap-for-woocommerce/(tests|node_modules|\.github|\.wordpress-org|bin|docs)/|/(phpunit|phpcs)(/|$)|/composer\.(json|lock)$' dist/files.txt | grep -v '/vendor/yahnis-elsts/' | grep -q .; then
            echo "::error::The zip contains development files."
            exit 1
          fi
          unzip -p "$zip" bitsnap-for-woocommerce/bitsnap-for-woocommerce.php | grep -q "Version: *${VERSION}$" \
            || { echo "::error::The plugin header in the zip is not version ${VERSION}."; exit 1; }
          echo "OK: $(wc -l < dist/files.txt) entries, $(du -h "$zip" | cut -f1)"
          rm dist/files.txt

      # The notes are the changelog section of readme.txt for this version.
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="= ${VERSION} =" '
            $0 == v { found = 1; next }
            found && /^= / { exit }
            found && /^== / { exit }
            found { print }
          ' readme.txt | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > dist/release-notes.md
          {
            echo
            echo "Install: download \`bitsnap-for-woocommerce.zip\` below and upload it in wp-admin under Plugins > Add New > Upload Plugin. Sites that already run the plugin get this update in wp-admin."
          } >> dist/release-notes.md
          cat dist/release-notes.md

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitsnap-for-woocommerce-${{ steps.version.outputs.version }}
          path: dist/bitsnap-for-woocommerce.zip

      # softprops/action-gh-release v2.6.2
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/bitsnap-for-woocommerce.zip
          body_path: dist/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
