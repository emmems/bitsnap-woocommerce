name: PHPUnit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit

  smoke:
    name: WooCommerce HPOS ${{ matrix.hpos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hpos: ['no', 'yes']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugin bundles PHP libraries (the update checker) from vendor/.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - run: npm run build
      - name: Start WordPress (retry a cold database startup once)
        run: npm run env:start || npm run env:start
      - run: npx wp-env run cli wp wc cot sync
      - run: npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled ${{ matrix.hpos }}
      - run: npm run test:smoke
      - name: Destroy WordPress environment
        if: always()
        run: printf "y\n" | npx wp-env destroy
