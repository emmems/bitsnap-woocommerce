name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the block script
        run: |
          npm ci
          npm run build

      # Check what would be released: the same files, with the same exclusions.
      - name: Assemble the release files
        run: |
          mkdir -p dist/bitsnap-for-woocommerce
          rsync -a --exclude-from=.distignore ./ dist/bitsnap-for-woocommerce/ --exclude=dist

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/bitsnap-for-woocommerce
          wp-version: latest
