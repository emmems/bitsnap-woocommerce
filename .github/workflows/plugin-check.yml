name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the block script
        run: |
          npm ci
          npm run build

      - name: Compile translations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          bash bin/build-mo.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      # Check what would be released: the same files, built by the same script as the release zip.
      - name: Assemble the release files
        run: |
          bash bin/build-zip.sh dist
          unzip -q dist/bitsnap-for-woocommerce.zip -d dist/unpacked

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/unpacked/bitsnap-for-woocommerce
          # The plugin updates itself from GitHub releases (it is not listed on WordPress.org), so this check is expected to flag it.
          exclude-checks: |
            plugin_updater
          wp-version: latest
